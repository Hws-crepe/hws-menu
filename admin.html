<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<meta name="robots" content="noindex, nofollow">
<title>توفر الأصناف — HWS CREPE</title>
<meta name="theme-color" content="#d9534f">
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'%3E%3Crect width='100' height='100' rx='22' fill='%23d9534f'/%3E%3Ctext x='50' y='70' font-size='54' font-weight='bold' text-anchor='middle' fill='white' font-family='sans-serif'%3EH%3C/text%3E%3C/svg%3E">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Cairo:wght@400;600;700;900&display=swap" rel="stylesheet">
<style>
/* نفس ألوان وخطوط المنيو الرئيسي */
:root{
  --red:#d9534f; --red-dark:#b8403c; --amber:#f0ad4e; --green:#25a35a;
  --ink:#1a1a1a; --ink-2:#5b6169; --ink-3:#8b9199;
  --bg:#f4f6f8; --surface:#fff; --surface-2:#fafbfc; --line:#e8ebee; --chipbg:#f1f3f5;
  --shadow-sm:0 2px 8px rgba(16,24,40,.05);
  --shadow:0 8px 24px rgba(16,24,40,.07);
  --shadow-lg:0 18px 44px rgba(16,24,40,.16);
  --r:18px; --r-lg:24px;
}
html[data-theme="dark"]{
  --ink:#eef1f4; --ink-2:#b3bac2; --ink-3:#828b95;
  --bg:#0f1216; --surface:#181c21; --surface-2:#1f242a; --line:#2a3038; --chipbg:#252b32;
  --shadow-sm:0 2px 8px rgba(0,0,0,.35);
  --shadow:0 8px 24px rgba(0,0,0,.45);
  --shadow-lg:0 18px 44px rgba(0,0,0,.6);
}
*,*::before,*::after{box-sizing:border-box}
html{-webkit-text-size-adjust:100%}
body{margin:0;font-family:'Cairo',system-ui,'Segoe UI',Tahoma,sans-serif;background:var(--bg);color:var(--ink);
  line-height:1.6;overflow-x:hidden;padding-bottom:env(safe-area-inset-bottom)}
button{font-family:inherit;cursor:pointer;border:none;background:none;color:inherit;padding:0;margin:0}
a{color:inherit}
input{font-family:inherit;font-size:1rem;color:inherit}
:focus-visible{outline:3px solid var(--amber);outline-offset:2px;border-radius:6px}
.hidden{display:none !important}
.wrap{max-width:720px;margin:0 auto;padding:0 16px}

/* الهيدر */
.top{background:#2a2a2a linear-gradient(180deg,#3a2423,#1c1c1c);color:#fff;
  padding:calc(16px + env(safe-area-inset-top)) 16px 18px;border-end-start-radius:26px;border-end-end-radius:26px}
.top-in{max-width:720px;margin:0 auto;display:flex;align-items:center;gap:12px}
.mark{width:52px;height:52px;flex:0 0 52px;border-radius:15px;background:var(--red);display:grid;place-items:center;
  font-weight:900;font-size:1.5rem;box-shadow:0 6px 16px rgba(0,0,0,.28)}
.top h1{margin:0;font-size:1.2rem;font-weight:900;line-height:1.3}
.top p{margin:0;font-size:.8rem;color:rgba(255,255,255,.7)}
.top .grow{flex:1;min-width:0}
.out-btn{background:rgba(255,255,255,.16);border:1px solid rgba(255,255,255,.22);color:#fff;
  padding:10px 16px;border-radius:30px;font-weight:800;font-size:.85rem;min-height:44px}

/* البطاقات والنماذج */
.card{background:var(--surface);border-radius:var(--r-lg);box-shadow:var(--shadow);padding:22px 18px;margin-top:18px}
.card h2{margin:0 0 6px;font-size:1.15rem;font-weight:900}
.card .lead{margin:0 0 18px;font-size:.88rem;color:var(--ink-3)}
.field{margin-bottom:14px}
.field label{display:block;font-size:.85rem;font-weight:800;margin-bottom:6px;color:var(--ink-2)}
.field input{width:100%;padding:14px 16px;border:1.5px solid var(--line);border-radius:14px;background:var(--surface-2);
  font-size:1.05rem;min-height:52px}
.field input:focus{outline:none;border-color:var(--red);background:var(--surface)}
.field input[type=email]{direction:ltr;text-align:right}
.pw{position:relative}
.pw input{padding-inline-end:84px;direction:ltr;text-align:right}
.pw button{position:absolute;inset-inline-end:8px;top:50%;transform:translateY(-50%);padding:8px 12px;border-radius:10px;
  background:var(--chipbg);font-size:.8rem;font-weight:800;color:var(--ink-2)}
.btn{display:flex;align-items:center;justify-content:center;gap:9px;width:100%;min-height:54px;
  padding:14px 16px;border-radius:40px;font-weight:800;font-size:1.02rem;transition:transform .15s,filter .15s}
.btn:active{transform:scale(.98)}
.btn:disabled{opacity:.55;cursor:not-allowed}
.btn-red{background:var(--red);color:#fff;box-shadow:0 6px 16px rgba(217,83,79,.28)}
.btn-ghost{background:var(--chipbg);color:var(--ink-2)}
.err{background:rgba(217,83,79,.1);border:1px solid rgba(217,83,79,.35);color:var(--red);border-radius:14px;
  padding:11px 14px;font-size:.88rem;font-weight:700;margin-bottom:14px}
.note{background:rgba(240,173,78,.12);border:1px solid rgba(240,173,78,.4);border-radius:14px;padding:12px 14px;
  font-size:.85rem;color:var(--ink-2)}
.note code{direction:ltr;unicode-bidi:embed;background:var(--chipbg);padding:1px 6px;border-radius:6px;font-size:.82rem}
.loading{text-align:center;padding:60px 20px;color:var(--ink-3);font-weight:700}
.spin{width:34px;height:34px;margin:0 auto 12px;border-radius:50%;border:4px solid var(--line);border-top-color:var(--red);
  animation:spin .8s linear infinite}
@keyframes spin{to{transform:rotate(360deg)}}

/* شريط الحالة */
.bar{display:flex;flex-wrap:wrap;align-items:center;gap:8px;margin-top:16px;font-size:.8rem;color:var(--ink-3)}
.bar .who{flex:1;min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;direction:ltr;text-align:right}
.net{display:inline-flex;align-items:center;gap:6px;font-weight:800;padding:6px 12px;border-radius:30px;
  background:var(--chipbg);color:var(--ink-2)}
.net::before{content:"";width:8px;height:8px;border-radius:50%;background:var(--ink-3)}
.net.on{background:rgba(37,163,90,.14);color:var(--green)}
.net.on::before{background:var(--green)}
.net.off{background:rgba(240,173,78,.16);color:#b77a1c}
.net.off::before{background:var(--amber)}
.sum{margin:12px 0 0;font-weight:800;font-size:.95rem}
.sum b{color:var(--red)}

/* البحث والتصنيفات */
.search{position:relative;margin-top:12px}
.search input{width:100%;border:1.5px solid transparent;border-radius:40px;padding:14px 48px 14px 18px;min-height:54px;
  background:var(--surface);box-shadow:var(--shadow-sm);font-size:1rem}
.search input:focus{outline:none;border-color:var(--red)}
.search svg{position:absolute;inset-inline-start:18px;top:50%;transform:translateY(-50%);width:20px;height:20px;color:var(--ink-3);pointer-events:none}
.search input::-webkit-search-cancel-button{-webkit-appearance:none;appearance:none}
.chips{display:flex;gap:8px;overflow-x:auto;padding:12px 0 4px;scrollbar-width:none;-webkit-overflow-scrolling:touch}
.chips::-webkit-scrollbar{display:none}
.chip{flex:0 0 auto;background:var(--surface);color:var(--ink-2);padding:10px 16px;min-height:44px;border-radius:30px;
  font-size:.9rem;font-weight:800;box-shadow:var(--shadow-sm);white-space:nowrap}
.chip.on{background:var(--red);color:#fff;box-shadow:0 6px 16px rgba(217,83,79,.3)}

/* قائمة الأصناف */
.list{margin-top:10px;background:var(--surface);border-radius:var(--r);box-shadow:var(--shadow);overflow:hidden}
.cat-h{padding:12px 16px 6px;font-size:.82rem;font-weight:900;color:var(--ink-3);background:var(--surface-2);border-bottom:1px solid var(--line)}
.it{display:flex;align-items:center;gap:12px;padding:12px 14px;border-bottom:1px solid var(--line);transition:background .2s}
.it:last-child{border-bottom:none}
.it.off{background:rgba(217,83,79,.05)}
.th{width:56px;height:56px;flex:0 0 56px;border-radius:14px;overflow:hidden;background:var(--line);display:grid;place-items:center;font-size:1.5rem}
.th img{width:100%;height:100%;object-fit:cover;display:block}
.it.off .th{filter:grayscale(1);opacity:.6}
.meta{flex:1;min-width:0}
.meta strong{display:block;font-size:.98rem;font-weight:800;line-height:1.35}
.meta small{display:block;font-size:.76rem;color:var(--ink-3)}
.line2{display:flex;flex-wrap:wrap;align-items:center;gap:6px;margin-top:3px}
.st{font-size:.74rem;font-weight:900;padding:2px 9px;border-radius:20px;background:rgba(37,163,90,.14);color:var(--green)}
.it.off .st{background:rgba(217,83,79,.12);color:var(--red)}
.sv{font-size:.74rem;font-weight:800;color:var(--ink-3)}
.sv[data-s="ok"]{color:var(--green)}
.sv[data-s="wait"]{color:#b77a1c}
.sv[data-s="err"]{color:var(--red)}

/* مفتاح التبديل — كبير للمس */
.sw{position:relative;width:66px;height:38px;flex:0 0 66px;border-radius:30px;background:var(--line);transition:background .2s}
.sw::before{content:"";position:absolute;inset:-6px}
.sw::after{content:"";position:absolute;top:4px;right:4px;width:30px;height:30px;border-radius:50%;background:#fff;
  box-shadow:0 2px 6px rgba(0,0,0,.25);transition:transform .2s}
.sw[aria-checked="true"]{background:var(--green)}
.sw[aria-checked="true"]::after{transform:translateX(-28px)}
.sw:disabled{opacity:.6;cursor:wait}

.empty{text-align:center;padding:40px 20px;color:var(--ink-3);font-weight:700}

footer{text-align:center;padding:26px 16px 18px;color:var(--ink-3);font-size:.78rem}
footer a{color:var(--ink-2);font-weight:700;text-underline-offset:3px}

.toast{position:fixed;bottom:calc(18px + env(safe-area-inset-bottom));left:0;right:0;width:fit-content;margin-inline:auto;
  max-width:calc(100% - 32px);background:var(--ink);color:var(--bg);padding:12px 22px;border-radius:40px;font-size:.92rem;
  font-weight:800;z-index:300;box-shadow:var(--shadow-lg);opacity:0;transform:translateY(24px);pointer-events:none;
  transition:opacity .25s,transform .25s;text-align:center}
html[data-theme="dark"] .toast{background:#2c333b;color:#fff}
.toast.show{opacity:1;transform:none}
.toast.ok{background:var(--green);color:#fff}
.toast.bad{background:var(--red);color:#fff}
@media (prefers-reduced-motion:reduce){*,*::before,*::after{animation-duration:.01ms !important;transition-duration:.01ms !important}}
</style>
</head>
<body>

<header class="top">
  <div class="top-in">
    <span class="mark">H</span>
    <div class="grow">
      <h1>توفر الأصناف</h1>
      <p>HWS CREPE — لوحة صاحب المطعم</p>
    </div>
    <button class="out-btn hidden" id="signOut" type="button">خروج</button>
  </div>
</header>

<main class="wrap">

  <!-- جارٍ التحميل -->
  <section id="vLoading" class="loading"><div class="spin"></div><span id="loadingMsg">جارٍ التحميل…</span></section>

  <!-- خطأ عام / Firebase غير مُعدّ -->
  <section id="vError" class="card hidden">
    <h2 id="errTitle">تعذّر التشغيل</h2>
    <div class="note" id="errBody"></div>
    <button class="btn btn-ghost" type="button" style="margin-top:16px" onclick="location.reload()">إعادة المحاولة</button>
  </section>

  <!-- تسجيل الدخول -->
  <section id="vLogin" class="card hidden">
    <h2>تسجيل الدخول</h2>
    <p class="lead">ادخل بحساب الأدمن لتغيير حالة الأصناف.</p>
    <form id="loginForm" novalidate>
      <div class="err hidden" id="loginErr" role="alert"></div>
      <div class="field">
        <label for="email">البريد الإلكتروني</label>
        <input id="email" type="email" inputmode="email" autocomplete="username" required>
      </div>
      <div class="field">
        <label for="password">كلمة السر</label>
        <div class="pw">
          <input id="password" type="password" autocomplete="current-password" required>
          <button type="button" id="pwToggle" aria-label="إظهار كلمة السر">إظهار</button>
        </div>
      </div>
      <button class="btn btn-red" id="loginBtn" type="submit">دخول</button>
    </form>
  </section>

  <!-- لوحة الأصناف -->
  <section id="vPanel" class="hidden">
    <div class="bar">
      <span class="net" id="net">جارٍ الاتصال…</span>
      <span class="who" id="who"></span>
    </div>
    <p class="sum" id="sum"></p>
    <div class="search">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2"><circle cx="11" cy="11" r="7"/><path d="m20 20-3.5-3.5"/></svg>
      <label class="hidden" for="q">بحث</label>
      <input id="q" type="search" placeholder="ابحث عن صنف…" autocomplete="off">
    </div>
    <div class="chips" id="chips" role="group" aria-label="التصنيفات"></div>
    <div class="list" id="list"></div>
  </section>

</main>

<footer>
  <p><a href="https://wa.me/249912243850" target="_blank" rel="noopener">تطوير Shasha Tech Solutions</a></p>
</footer>

<div class="toast" id="toast" role="status" aria-live="polite"></div>

<script type="module">
import { firebaseConfig, FIREBASE_SDK, firebaseReady } from "./firebase-config.js";

const $ = s => document.querySelector(s);
const esc = s => String(s == null ? "" : s).replace(/[&<>"']/g, c =>
  ({ "&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;" }[c]));
const money = n => Number(n || 0).toLocaleString("en-US");
const norm = s => String(s || "").toLowerCase()
  .replace(/[ً-ْٰـ]/g, "").replace(/[إأآٱ]/g, "ا")
  .replace(/[ىئ]/g, "ي").replace(/ة/g, "ه").trim();

/* نفس مظهر المنيو (فاتح/داكن) */
try {
  const saved = JSON.parse(localStorage.getItem("hws.theme"));
  const dark = saved === null ? matchMedia("(prefers-color-scheme: dark)").matches : saved === "dark";
  document.documentElement.setAttribute("data-theme", dark ? "dark" : "light");
} catch (e) {}

const views = ["vLoading", "vError", "vLogin", "vPanel"];
const view = id => views.forEach(v => $("#" + v).classList.toggle("hidden", v !== id));
function fail(title, html){ $("#errTitle").textContent = title; $("#errBody").innerHTML = html; view("vError"); }

let tT;
function toast(msg, kind){
  const el = $("#toast");
  el.textContent = msg; el.className = "toast show" + (kind ? " " + kind : "");
  clearTimeout(tT); tT = setTimeout(() => el.classList.remove("show"), 2600);
}

/* ---------- 1) قراءة الأصناف من index.html (الأسماء والأسعار والصور تبقى هناك) ---------- */
let ITEMS = [], CATS = [];
async function loadMenu(){
  // no-store: لا نقبل نسخة قديمة من ذاكرة sw.js. وإن وصلت نسخة قديمة رغم ذلك نعيد الطلب برابط فريد
  let doc, code;
  for (const url of ["./index.html", "./index.html?fresh=" + Date.now()]) {
    const res = await fetch(url, { cache: "no-store" });
    if (!res.ok) throw new Error("HTTP " + res.status);
    doc = new DOMParser().parseFromString(await res.text(), "text/html");
    code = doc.getElementById("menuData");
    if (code) break;
  }
  if (!code) throw new Error("menuData not found");
  const data = new Function(code.textContent + "\n;return { IMG, BRANCHES, CONFIG };")();
  const imgs = doc.getElementById("imgData");
  if (imgs) try { new Function("IMG", imgs.textContent)(data.IMG); } catch (e) {}

  const items = new Map(), cats = new Map(), nBr = data.BRANCHES.length;
  for (const b of data.BRANCHES) for (const c of b.menu) {
    if (!cats.has(c.id)) cats.set(c.id, { id: c.id, title: c.title[0], emoji: c.emoji || "" });
    for (const it of c.items) {
      let e = items.get(it.id);
      if (!e) items.set(it.id, e = { id: it.id, name: it.name[0], cat: c.id, emoji: c.emoji || "",
        img: data.IMG[it.img] || "", prices: new Set(), branches: [] });
      e.prices.add(it.price); e.branches.push(b.name[0]);
    }
  }
  const cur = data.CONFIG.currency[0];
  ITEMS = [...items.values()].map(e => ({ ...e,
    priceTxt: [...e.prices].map(money).join(" / ") + " " + cur,
    brTxt: e.branches.length < nBr ? e.branches.join("، ") + " فقط" : "" }));
  CATS = [...cats.values()];
}

/* ---------- 2) Firebase ---------- */
if (!firebaseReady()){
  fail("لم يتم إعداد Firebase بعد",
    "افتح الملف <code>firebase-config.js</code> وضع قيم مشروعك مكان <code>YOUR_…</code> ثم ارفعه.");
  throw new Error("firebase not configured");
}

let fb;
try {
  const [appM, authM, fs] = await Promise.all([
    import(`${FIREBASE_SDK}/firebase-app.js`),
    import(`${FIREBASE_SDK}/firebase-auth.js`),
    import(`${FIREBASE_SDK}/firebase-firestore.js`)
  ]);
  const app = appM.initializeApp(firebaseConfig);
  let db;
  try {
    db = fs.initializeFirestore(app, { localCache:
      fs.persistentLocalCache({ tabManager: fs.persistentMultipleTabManager() }) });
  } catch (e) { db = fs.getFirestore(app); }
  fb = { auth: authM.getAuth(app), authM, db, fs };
} catch (e) {
  console.error(e);
  fail("تعذّر تحميل Firebase", "تحقق من اتصال الإنترنت ثم أعد المحاولة.");
  throw e;
}
const { auth, authM, db, fs } = fb;

/* ---------- 3) تسجيل الدخول ---------- */
const AUTH_ERR = {
  "auth/invalid-credential": "البريد أو كلمة السر غير صحيحة",
  "auth/wrong-password": "البريد أو كلمة السر غير صحيحة",
  "auth/user-not-found": "البريد أو كلمة السر غير صحيحة",
  "auth/invalid-email": "صيغة البريد الإلكتروني غير صحيحة",
  "auth/missing-password": "الرجاء كتابة كلمة السر",
  "auth/too-many-requests": "محاولات كثيرة — انتظر قليلاً ثم حاول مجدداً",
  "auth/network-request-failed": "لا يوجد اتصال بالإنترنت",
  "auth/user-disabled": "هذا الحساب موقوف",
  "auth/operation-not-allowed": "فعّل Email/Password في Firebase Authentication"
};
$("#pwToggle").addEventListener("click", () => {
  const p = $("#password"), show = p.type === "password";
  p.type = show ? "text" : "password";
  $("#pwToggle").textContent = show ? "إخفاء" : "إظهار";
});
$("#loginForm").addEventListener("submit", async e => {
  e.preventDefault();
  const email = $("#email").value.trim(), pass = $("#password").value;
  const errEl = $("#loginErr");
  if (!email || !pass){ errEl.textContent = "الرجاء كتابة البريد وكلمة السر"; errEl.classList.remove("hidden"); return; }
  errEl.classList.add("hidden");
  $("#loginBtn").disabled = true; $("#loginBtn").textContent = "جارٍ الدخول…";
  try {
    await authM.signInWithEmailAndPassword(auth, email, pass);
    $("#password").value = "";
  } catch (err) {
    errEl.textContent = AUTH_ERR[err.code] || ("تعذّر الدخول (" + (err.code || err.message) + ")");
    errEl.classList.remove("hidden");
  } finally {
    $("#loginBtn").disabled = false; $("#loginBtn").textContent = "دخول";
  }
});
$("#signOut").addEventListener("click", () => authM.signOut(auth));

/* ---------- 4) لوحة الأصناف ---------- */
const avail = new Map();      // id → false إن كان غير متوفر (لا مستند ⇒ متوفر)
const seq = new Map();        // لتجاهل نتائج حفظ قديمة عند الضغط المتكرر
let unsub = null, cat = "all", built = false;

const isOn = id => avail.get(id) !== false;

function buildList(){
  $("#chips").innerHTML = [["all", "الكل"], ...CATS.map(c => [c.id, `${c.emoji} ${c.title}`]), ["off", "⛔ غير المتوفر"]]
    .map(([id, lbl]) => `<button class="chip${id === cat ? " on" : ""}" type="button" data-c="${esc(id)}">${esc(lbl)}</button>`).join("");
  $("#list").innerHTML = CATS.map(c =>
    `<div class="cat-h" data-cath="${esc(c.id)}">${esc(c.emoji + " " + c.title)}</div>` +
    ITEMS.filter(i => i.cat === c.id).map(i => `
      <div class="it" data-id="${esc(i.id)}" data-cat="${esc(i.cat)}" data-q="${esc(norm(i.name + " " + c.title + " " + i.id))}">
        <span class="th">${i.img ? `<img src="${esc(i.img)}" alt="" loading="lazy">` : esc(i.emoji)}</span>
        <div class="meta">
          <strong>${esc(i.name)}</strong>
          <small>${esc(i.priceTxt)}${i.brTxt ? " · " + esc(i.brTxt) : ""}</small>
          <div class="line2"><span class="st"></span><span class="sv" aria-live="polite"></span></div>
        </div>
        <button class="sw" type="button" role="switch" aria-label="${esc(i.name)} متوفر"></button>
      </div>`).join("")).join("") + `<div class="empty hidden" id="noRes">لا يوجد صنف مطابق</div>`;
  built = true;
}

function paint(){
  let off = 0;
  document.querySelectorAll(".it").forEach(row => {
    const on = isOn(row.dataset.id);
    if (!on) off++;
    row.classList.toggle("off", !on);
    row.querySelector(".sw").setAttribute("aria-checked", String(on));
    row.querySelector(".st").textContent = on ? "متوفر" : "غير متوفر";
  });
  $("#sum").innerHTML = off
    ? `<b>${off}</b> صنف غير متوفر من أصل ${ITEMS.length}`
    : `كل الأصناف متوفرة (${ITEMS.length})`;
  applyFilter();
}

function applyFilter(){
  const words = norm($("#q").value).split(/\s+/).filter(Boolean);
  let shown = 0;
  const visCats = new Set();
  document.querySelectorAll(".it").forEach(row => {
    const ok = (cat === "all" || (cat === "off" ? !isOn(row.dataset.id) : row.dataset.cat === cat))
      && words.every(w => row.dataset.q.includes(w));
    row.classList.toggle("hidden", !ok);
    if (ok){ shown++; visCats.add(row.dataset.cat); }
  });
  document.querySelectorAll("[data-cath]").forEach(h => h.classList.toggle("hidden", !visCats.has(h.dataset.cath)));
  $("#noRes").classList.toggle("hidden", !!shown);
}

function setStatus(id, s, txt){
  const el = document.querySelector(`.it[data-id="${CSS.escape(id)}"] .sv`);
  if (el){ el.dataset.s = s; el.textContent = txt; }
}

async function toggle(id){
  const available = !isOn(id);
  const n = (seq.get(id) || 0) + 1; seq.set(id, n);
  setStatus(id, "busy", "جارٍ الحفظ…");
  const slow = setTimeout(() => { if (seq.get(id) === n)
    setStatus(id, "wait", "محفوظ على الجهاز — يُرسل عند عودة الإنترنت"); }, 4000);
  try {
    await fs.setDoc(fs.doc(db, "items", id), { id, available, updatedAt: fs.serverTimestamp() });
    clearTimeout(slow);
    if (seq.get(id) === n){ setStatus(id, "ok", "تم الحفظ ✓"); toast("تم الحفظ ✓", "ok"); }
  } catch (err) {
    clearTimeout(slow);
    console.error(err);
    const msg = err.code === "permission-denied"
      ? "لا يملك هذا الحساب صلاحية — تأكد من بريد الأدمن في قواعد الأمان"
      : "فشل الحفظ — حاول مرة أخرى";
    if (seq.get(id) === n){ setStatus(id, "err", msg); toast(msg, "bad"); }
  }
}

$("#list").addEventListener("click", e => {
  const sw = e.target.closest(".sw");
  if (sw) toggle(sw.closest(".it").dataset.id);
});
$("#chips").addEventListener("click", e => {
  const b = e.target.closest("[data-c]"); if (!b) return;
  cat = b.dataset.c;
  document.querySelectorAll("#chips .chip").forEach(x => x.classList.toggle("on", x === b));
  applyFilter();
});
$("#q").addEventListener("input", applyFilter);

function setNet(fromCache){
  const n = $("#net");
  const online = navigator.onLine && !fromCache;
  n.className = "net " + (online ? "on" : "off");
  n.textContent = online ? "متصل — التغييرات تظهر للزبائن فوراً" : "غير متصل — تُعرض آخر حالة محفوظة";
}
let lastFromCache = false;
addEventListener("online", () => setNet(lastFromCache));
addEventListener("offline", () => setNet(true));

async function startPanel(user){
  $("#who").textContent = user.email || "";
  $("#signOut").classList.remove("hidden");
  if (!built){
    view("vLoading"); $("#loadingMsg").textContent = "جارٍ تحميل الأصناف…";
    try { await loadMenu(); }
    catch (e) {
      console.error(e);
      fail("تعذّر قراءة الأصناف", "يجب أن يكون <code>admin.html</code> بجانب <code>index.html</code> على نفس الموقع، وأن تفتحه من رابط الموقع (وليس كملف من الجهاز).");
      return;
    }
    buildList();
  }
  view("vPanel"); paint();
  if (unsub) unsub();
  unsub = fs.onSnapshot(fs.collection(db, "items"), { includeMetadataChanges: true }, snap => {
    avail.clear();
    snap.docs.forEach(d => { if (d.data().available === false) avail.set(d.id, false); });
    lastFromCache = snap.metadata.fromCache; setNet(lastFromCache);
    paint();
  }, err => {
    console.error(err);
    toast("تعذّر قراءة الحالة من Firebase", "bad");
  });
}

authM.onAuthStateChanged(auth, user => {
  if (user) startPanel(user);
  else {
    if (unsub){ unsub(); unsub = null; }
    $("#signOut").classList.add("hidden");
    view("vLogin");
  }
});
</script>
</body>
